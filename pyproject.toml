# Used only to host Rewire on Vercel (one project: the FastAPI backend, which also serves the built frontend).
# Local setup is unchanged: pip install -r backend/requirements.txt, then ./run.sh. See README.
[project]
name = "rewire"
version = "0.1.0"
requires-python = ">=3.12"
# What the server needs to run. Tests, charts and the validation scripts need more: backend/requirements.txt.
dependencies = [
    "fastapi==0.163.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "pillow==13.0.0",
    "pyyaml==6.0.3",
    "pydantic==2.14.3",
    "requests==2.34.2",
    "python-dotenv==1.2.4",
    "deepagents==0.7.38",
    "pyserial==3.5",
]
# Left out on purpose: langchain-google-genai (the Gemini team), langchain-community and twilio (text alerts). The
# hosted copy has no keys, so it runs the rule-driven agent team and alerts stay a dry run. Leaving them out keeps the
# bundle smaller. Add them back here if keys are ever set on the hosted project.

[tool.uv]
package = false  # an app, not a library: install the dependencies only

[tool.vercel]
entrypoint = "backend.app:app"

[tool.vercel.fastapi.static]
cdn = true  # serve the built screen from Vercel's CDN, so opening the page does not wait for the server to wake

[tool.vercel.scripts]
# VITE_API empty: the screen calls the same address it was served from.
build = "cd frontend && npm ci && VITE_API= npm run build"
